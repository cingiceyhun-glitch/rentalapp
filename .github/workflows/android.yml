# Builds the "Add to HomeHunt" Android app and publishes it at
# https://<your HomeHunt site>/homehunt.apk (via public/homehunt.apk).
name: Android app

on:
  push:
    branches: [claude/home-rental-search-app-fc3u1e]
    paths: ['android/**', 'src/shared/snapshot/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle --no-daemon -p android assembleRelease

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: homehunt-android
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish to the HomeHunt site
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk public/homehunt.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add public/homehunt.apk
          git commit -m "Android app build ${{ github.run_number }}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
